name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Start production server
        run: npm run start > /tmp/cabeus-server.log 2>&1 &
      - name: Accessibility and performance budgets
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3001/ >/dev/null && break
            sleep 1
          done
          npm run test:quality
      - name: Content, gating, and release readiness
        run: |
          npm run test:content-expiration
          node --test tests/production-content-import.test.mjs
          npm run test:email-operations
          npm run test:release
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-audit
          path: .tmp/quality-audit.json
          if-no-files-found: warn
      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readiness-audit
          path: .tmp/release-readiness-audit.json
          if-no-files-found: warn
      - name: Upload email operations report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: email-operations-audit
          path: .tmp/email-operations-audit.json
          if-no-files-found: warn
